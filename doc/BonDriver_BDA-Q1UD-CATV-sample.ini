; BonDriver_BDA 改 (β) ― PX-Q1UD / PX-S1UD 用 地デジ + CATV + スカパー!プレミアムサービス光 サンプル
;
; ※実験用です。PX-S1UD で スカパー!プレミアムサービス光 (J.83B 256QAM, NID 0x000A) を
;   580.75MHz で受信できたという報告を元にしています。PX-Q1UD では未確認です。
;
; 使い方:
;   1. このファイルを BonDriver_BDA_Q1UD.ini 等の名前で BonDriver の dll と同じ名前にしてコピー
;   2. [Tuner] の FriendlyName0 を、今使っている Q1UD 用 ini と同じ値にする
;   3. TVTest でチャンネルスキャン。受信できなければ DebugLog=YES にしてログを確認
;
; チューニング空間:
;   00 "UHF"      .. 地デジ UHF 13～52ch
;   01 "CATV"     .. CATV パススルー C13～C63ch (ISDB-T のまま)
;   02 "光"       .. スカパー!プレミアムサービス光 H001～H058 + H059～H105 (J.83B 256QAM)
;   03 "トラモジ" .. CATV トランスモジュレーション (J.83C 64QAM/256QAM)

[Tuner]
Guid=
; 今使っている Q1UD 用 ini の FriendlyName0 をそのまま書く
FriendlyName0=
Name="ISDB-T"
DVBSystemType="DVB-T"
DefaultNetwork="UHF/CATV"
;
; QAM (光・トラモジ) で「チューニングはできるがロックしない」場合は、
; 下記のコメントを外して DVB-C 用の TuningSpace を追加し、
; [TuningSpace02] / [TuningSpace03] の DVBSystemTypeNumber=1 のコメントも外してください。
; (Network Provider が汎用のものに変わります。地デジ側の動作が変わったら元に戻してください)
;DVBSystemType1="DVB-C"

[BonDriver]
DebugLog=NO
; Q1UD でドロップが出る場合 (BETA-Q1UD.md 参照)
BuffSize=1024
MaxBuffCount=1024

[Modulation]
ModulationType0SettingsAuto="ISDB-T"
ModulationType1SettingsAuto="J.83B-Opticast"
ModulationType2SettingsAuto="J.83C-64QAM"
ModulationType3SettingsAuto="J.83C-256QAM"

[Channel]
ReserveUnusedCh=NO

[TuningSpace00]
TuningSpaceName="UHF"
ChannelSettingsAuto="UHF"

[TuningSpace01]
TuningSpaceName="CATV"
ChannelSettingsAuto="CATV"
; C22ch が 167MHz、C24～C27ch が 233～251MHz の局は下記を指定
;ChannelSettingsAutoOptions="VHF+,C24+"

[TuningSpace02]
TuningSpaceName="光"
ChannelSettingsAuto="Opticast"
; HExt .. H059～H105 (470.25～769.25MHz) も作成 (580.75MHz は H076)
ChannelSettingsAutoOptions="HExt"
;DVBSystemTypeNumber=1
;
; 周波数を直接指定する場合の例 (CH番号=衛星番号,周波数MHz,偏波,変調方式番号,チャンネル名)
;CH200=0,580.750, ,1,580.75MHz

[TuningSpace03]
TuningSpaceName="トラモジ"
ChannelSettingsAuto="TransModulation"
; 64QAM だけで十分な場合 (チャンネル数が半分になります)
;ChannelSettingsAutoOptions="Only64QAM"
;DVBSystemTypeNumber=1
